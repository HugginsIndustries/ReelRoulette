name: CI

on:
  push:
  pull_request:

jobs:
  build-test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Show .NET SDK
        run: dotnet --version

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Build solution
        run: dotnet build ReelRoulette.sln --configuration Release -p:TargetFramework=net10.0 -p:EnableWindowsTargeting=true -m:1

      - name: Test solution
        run: dotnet test ReelRoulette.sln --configuration Release --no-build -p:TargetFramework=net10.0 -p:EnableWindowsTargeting=true -m:1

  build-test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Show .NET SDK
        run: dotnet --version

      - name: Install ffmpeg
        shell: pwsh
        env:
          # The Windows server release's build: these must match release.yml's
          # "Bundle FFmpeg into publish output (Windows server)" step.
          FFMPEG_RELEASE_TAG: autobuild-2026-09-30-13-08
          FFMPEG_ASSET: ffmpeg-n9.0.2-17-g2a571b6068-win64-gpl-9.0
          FFMPEG_SHA256: a0e45723c72141975f51d8666302e614711745f3102b704ca3f82c897a58d278
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'ffmpeg-download'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $zip = Join-Path $work "$env:FFMPEG_ASSET.zip"
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/$env:FFMPEG_RELEASE_TAG/$env:FFMPEG_ASSET.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          if ($hash -ne $env:FFMPEG_SHA256) {
            throw "FFmpeg download hash $hash does not match the pinned $env:FFMPEG_SHA256"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $work -Force
          $bin = Join-Path $work "$env:FFMPEG_ASSET/bin"
          # GITHUB_PATH applies from the next step on, so this step adds the folder to its own PATH too.
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $bin
          $env:PATH = "$bin;$env:PATH"
          ffmpeg -version

      - name: Build solution
        run: dotnet build ReelRoulette.sln --configuration Release

      - name: Test solution
        run: dotnet test ReelRoulette.sln --configuration Release --no-build

  web-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/clients/web/ReelRoulette.WebUI
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/clients/web/ReelRoulette.WebUI/package-lock.json

      - name: Show Node version
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: Verify web client
        run: npm run verify
