    FilterState:
      type: object
      additionalProperties: true
      description: |
        A library filter, as clients send it and presets store it. Browse, its counts, and random picks apply
        it the same way. Every field is optional, so `{}` is a valid filter, and each field's default applies
        when it is missing, or null where the field allows it. Fields not listed here are allowed and ignored.
      properties:
        favoritesOnly:
          type: boolean
          description: Only favorites. Defaults to false.
        excludeBlacklisted:
          type: boolean
          description: Leaves out blacklisted items. Defaults to true.
        onlyNeverPlayed:
          type: boolean
          description: Only items never played. Defaults to false.
        onlyKnownDuration:
          type: boolean
          description: Only videos with a known duration. Photos always pass. Defaults to false.
        onlyKnownLoudness:
          type: boolean
          description: Only videos with a known loudness. Photos always pass. Defaults to false.
        audioFilter:
          oneOf:
            - type: integer
            - type: string
          description: |
            `PlayAll` (0), `WithAudioOnly` (1), or `WithoutAudioOnly` (2), as a number or a name in any case.
            Photos always pass. Defaults to `PlayAll`.
        mediaTypeFilter:
          oneOf:
            - type: integer
            - type: string
          description: |
            `All` (0), `VideosOnly` (1), or `PhotosOnly` (2), as a number or a name in any case. Defaults to
            `All`.
        globalMatchMode:
          type: boolean
          nullable: true
          description: How selected tags from different categories combine. True is AND, false is OR, and null is AND.
        categoryLocalMatchModes:
          type: object
          nullable: true
          additionalProperties:
            oneOf:
              - type: integer
              - type: string
          description: |
            How selected tags in one category combine, keyed by category id: `And` (0) or `Or` (1), as a number
            or a name in any case. A category not listed is `And`.
        selectedTags:
          type: array
          nullable: true
          items:
            type: string
          description: |
            Tag names an item must match, ignoring case, combined by `globalMatchMode` and
            `categoryLocalMatchModes`. Defaults to none.
        excludedTags:
          type: array
          nullable: true
          items:
            type: string
          description: Tag names, ignoring case, that leave out any item holding one. Defaults to none.
        includedSourceIds:
          type: array
          nullable: true
          items:
            type: string
          description: Source ids to limit the filter to. Empty or missing means every enabled source.
        minDuration:
          anyOf:
            - type: string
            - type: number
            - type: "null"
          description: |
            Shortest video duration. A number is seconds, and a string is .NET TimeSpan text, such as
            `HH:MM:SS` or the desktop's `d.HH:MM:SS.fffffff`, so `"90"` is 90 days and `"1:30"` is 1 hour 30
            minutes. Videos without a known duration are left out, and photos always pass. Defaults to no limit.
        maxDuration:
          anyOf:
            - type: string
            - type: number
            - type: "null"
          description: |
            Longest video duration, written as `minDuration` is. Videos without a known duration are left out,
            and photos always pass. Defaults to no limit.

