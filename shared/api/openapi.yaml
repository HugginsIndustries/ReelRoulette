            type: string

    ClearPlaybackStatsRequest:
      type: object
      description: Names either `allItems` or `itemIds`, never both.
      properties:
        allItems:
          type: boolean
          description: True clears every item's playback stats. Defaults to false.
        itemIds:
          type: array
          nullable: true
          description: Catalog item ids whose playback stats to clear. An id not in the catalog is skipped.
          items:
            type: string

    ClearPlaybackStatsResponse:
      type: object
      required:
        - clearedCount
      properties:
        clearedCount:
          type: integer
          format: int32

    ServerEventEnvelope:
      type: object
      required:
        - revision
        - eventType
        - timestamp
        - payload
      properties:
        revision:
          type: integer
          format: int64
        eventType:
          type: string
        timestamp:
          type: string
          format: date-time
        payload:
          oneOf:
            - $ref: "#/components/schemas/ItemStateChangedPayload"
            - $ref: "#/components/schemas/BulkItemStateChangedPayload"
            - $ref: "#/components/schemas/ItemRatingChangedPayload"
            - $ref: "#/components/schemas/BulkItemRatingChangedPayload"
            - $ref: "#/components/schemas/ItemsRemovedPayload"
            - $ref: "#/components/schemas/PlaybackRecordedPayload"
            - $ref: "#/components/schemas/ResyncRequiredPayload"
            - $ref: "#/components/schemas/ItemTagsChangedPayload"
            - $ref: "#/components/schemas/TagCatalogChangedPayload"
            - $ref: "#/components/schemas/PresetCatalogChangedPayload"
            - $ref: "#/components/schemas/SourceStateChangedPayload"
            - $ref: "#/components/schemas/RefreshStatusChangedPayload"
            - $ref: "#/components/schemas/StreamOpenedPayload"

    ItemStateChangedPayload:
      type: object
      required:
        - itemId
        - path
        - isFavorite
        - isBlacklisted
        - previousIsFavorite
        - previousIsBlacklisted
      properties:
        itemId:
          type: string
        path:
          type: string
        isFavorite:
          type: boolean
        isBlacklisted:
          type: boolean
        previousIsFavorite:
          type: boolean
          description: Favorite before this change.
        previousIsBlacklisted:
          type: boolean
          description: Blacklist before this change.
        clientId:
          type: string
          nullable: true
          description: The client that made the change, from its favorite or blacklist request, or null when the request named none.

    BulkItemStateChangedPayload:
      type: object
      description: >
        Published by `POST /api/bulk/item-state` when any named item is in the library, for all of them at once.
      required:
        - flag
        - value
        - count
        - items
      properties:
        flag:
          type: string
          enum:
            - favorite
            - blacklist
          description: The flag the request set or cleared.
        value:
          type: boolean
          description: True when the request set the flag, false when it cleared it.
        count:
          type: integer
          format: int32
          description: How many of the named items are in the library, each of which now has the requested state.
        items:
          type: array
          description: The items whose favorite or blacklist this change changed. The others already had the requested state.
          items:
            $ref: "#/components/schemas/BulkItemState"
        clientId:
          type: string
          nullable: true
          description: The client that made the change, from its request, or null when the request named none.

    BulkItemState:
      type: object
      required:
        - itemId
        - isFavorite
        - isBlacklisted
        - previousIsFavorite
        - previousIsBlacklisted
      properties:
        itemId:
          type: string
        isFavorite:
          type: boolean
        isBlacklisted:
          type: boolean
        previousIsFavorite:
          type: boolean
          description: Favorite before this change.
        previousIsBlacklisted:
          type: boolean
          description: Blacklist before this change.

    BulkItemRatingChangedPayload:
      type: object
      description: >
        Published by `POST /api/bulk/rating` when any named item is in the library, for all of them at once.
      required:
        - rating
        - count
        - items
      properties:
        rating:
          type: number
          format: double
          nullable: true
          description: The rating the request set, in stars, or null when it cleared the rating.
        count:
          type: integer
          format: int32
          description: How many of the named items are in the library, each of which now has the requested rating.
        items:
          type: array
          description: The items whose rating this change changed. The others already had the requested rating.
          items:
            $ref: "#/components/schemas/BulkItemRating"
        clientId:
          type: string
          nullable: true
          description: The client that made the change, from its request, or null when the request named none.

    BulkItemRating:
      type: object
      required:
        - itemId
        - rating
        - previousRating
      properties:
        itemId:
          type: string
        rating:
          type: number
          format: double
          nullable: true
          description: The rating in stars, or null for none.
        previousRating:
          type: number
          format: double
          nullable: true
          description: The rating before this change, in stars, or null for none.

    ItemsRemovedPayload:
      type: object
      description: >
        Published by `POST /api/library/delete-files` and `POST /api/duplicates/apply` for the items they removed from
        the library.
      required:
        - itemIds
      properties:
        itemIds:
          type: array
          items:
            type: string

    ItemRatingChangedPayload:
      type: object
      description: Published by `POST /api/rating` only when the rating changed.
      required:
        - itemId
        - path
        - rating
        - previousRating
      properties:
        itemId:
          type: string
        path:
          type: string
        rating:
          type: number
          format: double
          nullable: true
          description: The rating in stars, from 0.5 to 5 in half-star steps, or null for none.
        previousRating:
          type: number
          format: double
          nullable: true
          description: The rating before this change, in stars, or null for none.
        clientId:
          type: string
          nullable: true
          description: The client that made the change, from its rating request, or null when the request named none.

    PlaybackRecordedPayload:
      type: object
      required:
        - itemId
      properties:
        itemId:
          type: string
          description: Catalog item id of the file that was played.
        clientId:
          type: string
          nullable: true
        sessionId:
          type: string
          nullable: true
        playCount:
          type: integer
          format: int32
          nullable: true
          description: Play count after this play.
        lastPlayedUtc:
          type: string
          format: date-time
          nullable: true
          description: Last-played time after this play.
        previousLastPlayedUtc:
          type: string
          format: date-time
          nullable: true
          description: Last-played time from before this play. Null when the file had never been played.

    ResyncRequiredPayload:
      type: object
      required:
        - reason
        - lastEventId
        - currentRevision
      properties:
        reason:
          type: string
          example: revisionGap
        lastEventId:
          type: integer
          format: int64
        currentRevision:
          type: integer
          format: int64

    StreamOpenedPayload:
      type: object
      description: First event on a stream opened without a last event ID. Its envelope revision is the server's current revision, so a client can resume from it after a reconnect even when no other event arrived.
      required:
        - currentRevision
      properties:
        currentRevision:
          type: integer
          format: int64

    LibraryStateResponse:
      type: object
      required:
        - itemId
        - path
        - isFavorite
        - isBlacklisted
        - revision
      properties:
        itemId:
          type: string
        path:
          type: string
        isFavorite:
          type: boolean
        isBlacklisted:
          type: boolean
        revision:
          type: integer
          format: int64

    ItemRatingResponse:
      type: object
      required:
        - itemId
        - rating
        - revision
      properties:
        itemId:
          type: string
        rating:
          type: number
          format: double
          nullable: true
          description: The item's rating in stars, or null for none.
        revision:
          type: integer
          format: int64
          description: The revision of the `itemRatingChanged` event the change published, or the server's current revision when the rating was already this one.

    CreatePresetRequest:
      type: object
      required:
        - name
        - filterState
      properties:
        name:
          type: string
          description: Trimmed before it is saved.
        filterState:
          anyOf:
            - $ref: "#/components/schemas/FilterState"
            - type: "null"
          description: Stored as posted. Omitted or null is the default filter, which a preset can't hold.
        clientId:
          type: string
          nullable: true
          description: The client making the change, which `presetCatalogChanged` carries back.

    UpdatePresetFilterRequest:
      type: object
      required:
        - filterState
      properties:
        filterState:
          anyOf:
            - $ref: "#/components/schemas/FilterState"
            - type: "null"
          description: Stored as posted. Omitted or null is the default filter, which a preset can't hold.
        clientId:
          type: string
          nullable: true
          description: The client making the change, which `presetCatalogChanged` carries back.

    RenamePresetRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Trimmed before it is saved.
        clientId:
          type: string
          nullable: true
          description: The client making the change, which `presetCatalogChanged` carries back.

    ReorderPresetsRequest:
      type: object
      required:
        - presetIds
      properties:
        presetIds:
          type: array
          items:
            type: string
          description: Every preset's id, once each, in the new order.
        clientId:
          type: string
          nullable: true
          description: The client making the change, which `presetCatalogChanged` carries back.

    DeletePresetRequest:
      type: object
      properties:
        clientId:
          type: string
          nullable: true
          description: The client making the change, which `presetCatalogChanged` carries back.

    TagCategorySnapshot:
      type: object
      required: [id, name, sortOrder]
      properties:
        id:
          type: string
        name:
          type: string
        sortOrder:
          type: integer
          format: int32

    TagSnapshot:
      type: object
      required: [name, categoryId]
      properties:
        name:
          type: string
        categoryId:
          type: string

    ItemTagsSnapshot:
      type: object
      required: [itemId, tags]
      properties:
        itemId:
          type: string
        tags:
          type: array
          items:
            type: string

    TagEditorModelRequest:
      type: object
      properties:
        itemIds:
          type: array
          items:
            type: string
        countsOnly:
          type: boolean
          description: >
            True answers `tagCounts` and `itemCount` for the items in place of each item's tags, and `items` is empty.
            Defaults to false.

    TagEditorModelResponse:
      type: object
      required: [categories, tags, items]
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/TagCategorySnapshot"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagSnapshot"
        items:
          type: array
          description: Each requested item's tags, empty with `countsOnly`.
          items:
            $ref: "#/components/schemas/ItemTagsSnapshot"
        tagCounts:
          type: array
          description: With `countsOnly`, each tag the items hold and how many of them hold it.
          items:
            $ref: "#/components/schemas/TagItemCount"
        itemCount:
          type: integer
          format: int32
          description: With `countsOnly`, how many of the requested items are in the library.

    TagItemCount:
      type: object
      required: [name, itemCount]
      properties:
        name:
          type: string
          description: The tag's name as the items hold it.
        itemCount:
          type: integer
          format: int32
          description: How many of the requested items hold the tag, compared ignoring case.

    ApplyItemTagsRequest:
      type: object
      required: [itemIds]
      properties:
        itemIds:
          type: array
          items:
            type: string
        addTags:
          type: array
          items:
            type: string
        removeTags:
          type: array
          items:
            type: string

    UpsertCategoryRequest:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        sortOrder:
          type: integer
          format: int32
          nullable: true

    UpsertTagRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        categoryId:
          type: string

    RenameTagRequest:
      type: object
      required: [oldName, newName]
      properties:
        oldName:
          type: string
        newName:
          type: string
        newCategoryId:
          type: string
          nullable: true

    DeleteTagRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    DeleteCategoryRequest:
      type: object
      required: [categoryId]
      properties:
        categoryId:
          type: string
        newCategoryId:
          type: string
          nullable: true

    RefreshStartRequest:
      type: object
      properties:
        trigger:
          type: string

    RefreshStartResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
        message:
          type: string
          nullable: true
        runId:
          type: string
          nullable: true

    RefreshSettingsSnapshot:
      type: object
      required: [autoRefreshEnabled, autoRefreshIntervalMinutes]
      properties:
        autoRefreshEnabled:
          type: boolean
        autoRefreshIntervalMinutes:
          type: integer
          format: int32
        forceRescanLoudness:
          type: boolean
          description: Rescan loudness for every item on the next refresh. The server clears it once that loudness stage ends, unless the refresh is canceled.
        forceRescanDuration:
          type: boolean
          description: Rescan duration for every item on the next refresh. The server clears it once that duration stage ends, unless the refresh is canceled.
        fingerprintScanMaxDegreeOfParallelism:
          type: integer
          format: int32
          description: Max parallel fingerprint hashes during core refresh (1-16).

    BackupSettingsSnapshot:
      type: object
      required: [enabled, minimumBackupGapMinutes, numberOfBackups]
      properties:
        enabled:
          type: boolean
        minimumBackupGapMinutes:
          type: integer
          format: int32
          description: Minimum minutes between backups (1-10080).
        numberOfBackups:
          type: integer
          format: int32
          description: Backups kept per kind (1-100).

    WebRuntimeSettingsSnapshot:
      type: object
      required: [enabled, port, bindOnLan, mdnsEnabled, lanHostname, authMode, sharedToken]
      properties:
        enabled:
          type: boolean
        port:
          type: integer
          format: int32
        bindOnLan:
          type: boolean
          description: Allow remote connections. Off serves only the server machine, and every request from another device, directly or through a proxy, returns 403. On also listens on the LAN.
        mdnsEnabled:
          type: boolean
          description: When false, the server does not advertise `{lanHostname}.local` on the network.
        lanHostname:
          type: string
        authMode:
          type: string
          description: Web client auth mode, such as `TokenRequired`.
        sharedToken:
          type: string
          nullable: true

    LibraryStatsResponse:
      type: object
      required: [global, sources]
      properties:
        global:
          $ref: "#/components/schemas/LibraryGlobalStatsResponse"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceStatsResponse"

    LibraryGlobalStatsResponse:
      type: object
      required:
        - totalVideos
        - totalPhotos
        - totalMedia
        - favorites
        - blacklisted
        - rated
        - uniquePlayedMedia
        - neverPlayedMedia
        - totalPlays
        - videosWithAudio
        - videosWithoutAudio
        - baselineLoudnessLufs
      properties:
        totalVideos:
          type: integer
          format: int32
        totalPhotos:
          type: integer
          format: int32
        totalMedia:
          type: integer
          format: int32
        favorites:
          type: integer
          format: int32
        blacklisted:
          type: integer
          format: int32
        rated:
          type: integer
          format: int32
          description: Items with a rating.
        uniquePlayedMedia:
          type: integer
          format: int32
        neverPlayedMedia:
          type: integer
          format: int32
        totalPlays:
          type: integer
          format: int32
        videosWithAudio:
          type: integer
          format: int32
        videosWithoutAudio:
          type: integer
          format: int32
        baselineLoudnessLufs:
          type: number
          format: double

    SourceStatsResponse:
      type: object
      required:
        - sourceId
        - rootPath
        - displayName
        - isEnabled
        - totalVideos
        - totalPhotos
        - totalMedia
        - videosWithAudio
        - videosWithoutAudio
        - totalDurationSeconds
        - averageDurationSeconds
      properties:
        sourceId:
          type: string
        rootPath:
          type: string
        displayName:
          type: string
          nullable: true
        isEnabled:
          type: boolean
        totalVideos:
          type: integer
          format: int32
        totalPhotos:
          type: integer
          format: int32
        totalMedia:
          type: integer
          format: int32
        videosWithAudio:
          type: integer
          format: int32
        videosWithoutAudio:
          type: integer
          format: int32
        totalDurationSeconds:
          type: number
          format: double
        averageDurationSeconds:
          type: number
          format: double
          nullable: true

    DuplicateScanRequest:
      type: object
      properties:
        scope:
          type: string
          enum: [CurrentSource, AllEnabledSources, AllSources]
        sourceId:
          type: string
          nullable: true

    DuplicateScanResponse:
      type: object
      required: [groups, excludedPending, excludedFailed, excludedStale]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/DuplicateGroupResponse"
        excludedPending:
          type: integer
          format: int32
        excludedFailed:
          type: integer
          format: int32
        excludedStale:
          type: integer
          format: int32

    DuplicateGroupResponse:
      type: object
      required: [fingerprint, items]
      properties:
        fingerprint:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/DuplicateGroupItemResponse"

    DuplicateGroupItemResponse:
      type: object
      required: [itemId, fullPath, sourceId, isFavorite, isBlacklisted, playCount, tagCount]
      properties:
        itemId:
          type: string
        fullPath:
          type: string
        sourceId:
          type: string
        isFavorite:
          type: boolean
        isBlacklisted:
          type: boolean
        playCount:
          type: integer
          format: int32
        tagCount:
          type: integer
          format: int32

    DuplicateApplyRequest:
      type: object
      required: [selections]
      properties:
        selections:
          type: array
          items:
            $ref: "#/components/schemas/DuplicateApplySelection"

    DuplicateApplySelection:
      type: object
      required: [keepItemId, itemIds]
      properties:
        keepItemId:
          type: string
        itemIds:
          type: array
          items:
            type: string

    DuplicateApplyResponse:
      type: object
      required: [deletedOnDisk, removedFromLibrary, failures]
      properties:
        deletedOnDisk:
          type: integer
          format: int32
        removedFromLibrary:
          type: integer
          format: int32
        failures:
          type: array
          items:
            $ref: "#/components/schemas/DuplicateApplyFailure"

    DuplicateApplyFailure:
      type: object
      required: [itemId, fullPath, reason]
      properties:
        itemId:
          type: string
        fullPath:
          type: string
        reason:
          type: string

    AutoTagScanRequest:
      type: object
      properties:
        scanFullLibrary:
          type: boolean
          description: When true, scan every item. When false, scan enabled sources only.

    AutoTagScanResponse:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/AutoTagMatchRowResponse"

    AutoTagMatchRowResponse:
      type: object
      required: [tagName, totalMatchedCount, wouldChangeCount, files]
      properties:
        tagName:
          type: string
        totalMatchedCount:
          type: integer
          format: int32
        wouldChangeCount:
          type: integer
          format: int32
        files:
          type: array
          items:
            $ref: "#/components/schemas/AutoTagMatchedFileResponse"

    AutoTagMatchedFileResponse:
      type: object
      required: [itemId, fullPath, displayPath, needsChange]
      properties:
        itemId:
          type: string
        fullPath:
          type: string
        displayPath:
          type: string
        needsChange:
          type: boolean

    AutoTagApplyRequest:
      type: object
      required: [assignments]
      properties:
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/AutoTagAssignment"

    AutoTagAssignment:
      type: object
      required: [tagName, itemPaths]
      properties:
        tagName:
          type: string
        itemPaths:
          type: array
          items:
            type: string

    AutoTagAppliedAssignment:
      type: object
      required: [tagName, changedItemIds]
      properties:
        tagName:
          type: string
        changedItemIds:
          type: array
          description: Catalog item ids of the files that gained this tag.
          items:
            type: string

    AutoTagApplyResponse:
      type: object
      required: [applied]
      properties:
        applied:
          type: array
          description: One entry per tag that was newly written, listing only the files that gained that tag.
          items:
            $ref: "#/components/schemas/AutoTagAppliedAssignment"

    ClientLogRequest:
      type: object
      required: [source, level, message]
      properties:
        source:
          type: string
        level:
          type: string
        message:
          type: string

    RefreshStageProgress:
      type: object
      required: [stage, percent, message, isComplete]
      properties:
        stage:
          type: string
        percent:
          type: integer
          format: int32
        message:
          type: string
        isComplete:
          type: boolean

    RefreshStatusSnapshot:
      type: object
      required: [isRunning, trigger, stages]
      properties:
        isRunning:
          type: boolean
        runId:
          type: string
          nullable: true
        trigger:
          type: string
        startedUtc:
          type: string
          format: date-time
          nullable: true
        completedUtc:
          type: string
          format: date-time
          nullable: true
        currentStage:
          type: string
          nullable: true
        lastError:
          type: string
          nullable: true
        stages:
          type: array
          items:
            $ref: "#/components/schemas/RefreshStageProgress"
        keptSources:
          type: array
          description: >
            The sources this run kept because their folder listed no media files while the library held items
            from them, such as a drive or share that isn't mounted. Empty when the run kept none, and cleared
            when the next run starts.
          items:
            $ref: "#/components/schemas/RefreshKeptSource"

    RefreshKeptSource:
      type: object
      required: [sourceId, itemCount]
      properties:
        sourceId:
          type: string
          description: The source's id, as `GET /api/sources` lists it. The folder is left out, since the status goes to every client.
        itemCount:
          type: integer
          format: int32
          description: How many of the library's items from the source were kept.

    ItemTagsChangedPayload:
      type: object
      required: [resolvedItemIds, addedTags, removedTags]
      properties:
        resolvedItemIds:
          type: array
          description: Catalog item ids of the files the change applies to.
          items:
            type: string
        addedTags:
          type: array
          items:
            type: string
        removedTags:
          type: array
          items:
            type: string
        catalogReplacedTag:
          type: string
          nullable: true
          description: Set when this event renames or deletes the tag in the catalog. Absent for a per-item edit.
        catalogReplacementTag:
          type: string
          nullable: true
          description: The new name when catalogReplacedTag is a rename. Absent when that tag was deleted.

    TagCatalogChangedPayload:
      type: object
      required: [reason, categories, tags]
      properties:
        reason:
          type: string
        categories:
          type: array
          items:
            $ref: "#/components/schemas/TagCategorySnapshot"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagSnapshot"

    PresetCatalogChangedPayload:
      type: object
      description: >-
        Published by each preset create, update, rename, reorder, and delete. Tag rename and delete publish none,
        so clients see the presets they change through `tagCatalogChanged`.
      required:
        - presetId
        - clientId
      properties:
        presetId:
          type: string
          nullable: true
          description: The preset created, updated, renamed, or deleted, or null when the presets were reordered.
        clientId:
          type: string
          nullable: true
          description: The client whose request made the change, so it can tell its own change from another device's.

    SourceStateChangedPayload:
      type: object
      required:
        - sourceId
        - isEnabled
      properties:
        sourceId:
          type: string
        isEnabled:
          type: boolean

    RefreshStatusChangedPayload:
      type: object
      required: [snapshot]
      properties:
        snapshot:
          $ref: "#/components/schemas/RefreshStatusSnapshot"

  responses:
    LibraryUnavailable:
      description: >
        The server is running without a library. `error` says why and what to do, and `code` is
        `library_newer`, `library_damaged`, `library_missing`, or `library_unreadable`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
