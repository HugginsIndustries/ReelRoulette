  /api/thumbnail/{itemId}:
    get:
      summary: Get generated thumbnail by item id
      operationId: getThumbnailByItemId
      description: >-
        Every 200 and 304 response carries an ETag and Last-Modified. A request whose `v` matches the thumbnail's current
        version is cacheable for a year as immutable. Any other request gets `Cache-Control: no-cache` and is
        revalidated against the ETag.
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
        - name: v
          in: query
          required: false
          description: The item's `thumbnailVersion` from the list query page.
          schema:
            type: string
      responses:
        "200":
          description: Thumbnail image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: The thumbnail matches the request's If-None-Match or If-Modified-Since.
        "404":
          description: Thumbnail not found
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/events:
    get:
      summary: Stream server events
      operationId: getEventsSse
      description: |
        SSE stream with monotonic `id` values matching envelope `revision`.
        Reconnect behavior:
        - A stream opened without a last event ID starts with a `streamOpened`
          event whose revision is the server's current revision, so a client
          that receives no other event can still resume from it.
        - Client reconnects with `Last-Event-ID`, including 0.
        - Server replays buffered events newer than that revision when available.
        - If the revision gap exceeds replay buffer retention, server emits a
          `resyncRequired` event. Clients requery the state they still show.
          An item-state read returns only the requested paths. An empty path list returns no items.
        Identity/session continuity:
        - Clients should provide a stable `clientId` per installation/device.
        - Clients may provide an optional `sessionId` per runtime session to
          correlate reconnect attempts and playback-originated events.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
          description: Last acknowledged SSE revision from the previous connection.
        - name: lastEventId
          in: query
          required: false
          schema:
            type: string
          description: Query-string reconnect revision fallback for browser EventSource clients.
        - name: clientId
          in: query
          required: false
          schema:
            type: string
            nullable: true
          description: Stable client identity for cross-request correlation.
        - name: sessionId
          in: query
          required: false
          schema:
            type: string
            nullable: true
          description: Optional runtime session identity for reconnect/playback correlation.
        - name: clientType
          in: query
          required: false
          schema:
            type: string
            nullable: true
          description: Optional client type hint (for example desktop/web/mobile-web/operator).
        - name: deviceName
          in: query
          required: false
          schema:
            type: string
            nullable: true
          description: Optional friendly device/client label shown in operator diagnostics.
      responses:
        "200":
          description: Event stream (SSE)
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ServerEventEnvelope"
        "401":
          description: Unauthorized when auth is required and request is not paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    PairRequest:
      type: object
      properties:
        token:
          type: string
          nullable: true

    PairResponse:
      type: object
      required:
        - paired
        - message
      properties:
        paired:
          type: boolean
        message:
          type: string

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        code:
          type: string
          nullable: true
          description: Machine-readable error code when applicable (e.g. `POST /api/play/{itemId}`).

    VersionResponse:
      type: object
      required:
        - appVersion
        - apiVersion
        - minimumCompatibleApiVersion
        - supportedApiVersions
        - capabilities
      properties:
        appVersion:
          type: string
        apiVersion:
          type: string
        assetsVersion:
          type: string
          nullable: true
        minimumCompatibleApiVersion:
          type: string
        supportedApiVersions:
          type: array
          items:
            type: string
        capabilities:
          type: array
          items:
            type: string

    CapabilitiesResponse:
      type: object
      required:
        - capabilities
      properties:
        capabilities:
          type: array
          items:
            type: string

    RestartResponse:
      type: object
      required:
        - accepted
        - message
      properties:
        accepted:
          type: boolean
        message:
          type: string

    ServerUpdatePhase:
      type: string
      enum:
        - notInstalled
        - idle
        - noReleases
        - checkFailed
        - upToDate
        - updateAvailable
        - downloading
        - updateReady
        - restarting

    ServerUpdateStatusResponse:
      type: object
      required:
        - phase
        - message
        - velopackInstalled
      properties:
        phase:
          $ref: "#/components/schemas/ServerUpdatePhase"
        runningVersion:
          type: string
          nullable: true
        targetVersion:
          type: string
          nullable: true
        message:
          type: string
        velopackInstalled:
          type: boolean

    ServerUpdateActionResponse:
      type: object
      required:
        - accepted
        - phase
        - message
        - velopackInstalled
      properties:
        accepted:
          type: boolean
        phase:
          $ref: "#/components/schemas/ServerUpdatePhase"
        runningVersion:
          type: string
          nullable: true
        targetVersion:
          type: string
          nullable: true
        message:
          type: string
        velopackInstalled:
          type: boolean

    ControlRuntimeSettingsSnapshot:
      type: object
      required:
        - adminAuthMode
      properties:
        adminAuthMode:
          type: string
          enum:
            - Off
            - TokenRequired
          description: >
            Read-only. GET always returns TokenRequired, and a posted value is ignored:
            every non-local control request needs the control token.
        adminSharedToken:
          type: string
          nullable: true
          description: >
            The control token. The server generates and saves one on start when none is set.
            POST rejects an empty value, and a changed token ends every control session.
        devChannelEnabled:
          type: boolean
          nullable: true
          description: >
            When omitted or null on POST, the persisted dev-channel preference is left unchanged.
            GET always returns the current boolean value (stable or dev update channel).

    ControlApplyResult:
      type: object
      required:
        - accepted
        - restartRequired
        - message
      properties:
        accepted:
          type: boolean
        restartRequired:
          type: boolean
        message:
          type: string
        errors:
          type: array
          items:
            type: string

    StartupLaunchStatus:
      type: object
      required: [supported, launchServerOnStartup, message]
      properties:
        supported:
          type: boolean
        launchServerOnStartup:
          type: boolean
        message:
          type: string

    StartupLaunchUpdateRequest:
      type: object
      properties:
        launchServerOnStartup:
          type: boolean

    StartupLaunchResult:
      type: object
      required: [accepted, supported, launchServerOnStartup, message]
      properties:
        accepted:
          type: boolean
        supported:
          type: boolean
        launchServerOnStartup:
          type: boolean
        message:
          type: string

    ControlSettingsApplyResponse:
      type: object
      required:
        - settings
        - result
      properties:
        settings:
          $ref: "#/components/schemas/ControlRuntimeSettingsSnapshot"
        result:
          $ref: "#/components/schemas/ControlApplyResult"

    ApiEventTelemetryEntry:
      type: object
      required:
        - timestampUtc
        - direction
        - method
        - path
      properties:
        timestampUtc:
          type: string
          format: date-time
        direction:
          type: string
        method:
          type: string
        path:
          type: string
        statusCode:
          type: integer
          format: int32
          nullable: true
        eventType:
          type: string
          nullable: true

    ConnectedClientsSnapshot:
      type: object
      required:
        - apiPairedSessions
        - controlPairedSessions
        - sseSubscribers
        - apiSessions
        - controlSessions
        - activeSseClients
      properties:
        apiPairedSessions:
          type: integer
          format: int32
        controlPairedSessions:
          type: integer
          format: int32
        sseSubscribers:
          type: integer
          format: int32
        apiSessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfoSnapshot"
        controlSessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfoSnapshot"
        activeSseClients:
          type: array
          items:
            $ref: "#/components/schemas/SseClientInfoSnapshot"

    ControlStatusResponse:
      type: object
      required:
        - serverTimeUtc
        - isHealthy
        - listenUrl
        - lanExposed
        - connectedClients
      properties:
        serverTimeUtc:
          type: string
          format: date-time
        isHealthy:
          type: boolean
        listenUrl:
          type: string
        lanExposed:
          type: boolean
          description: Whether remote connections are allowed (the web runtime setting `bindOnLan`).
        connectedClients:
          $ref: "#/components/schemas/ConnectedClientsSnapshot"
        incomingApiEvents:
          type: array
          items:
            $ref: "#/components/schemas/ApiEventTelemetryEntry"
        outgoingApiEvents:
          type: array
          items:
            $ref: "#/components/schemas/ApiEventTelemetryEntry"
        testing:
          $ref: "#/components/schemas/OperatorTestingStateSnapshot"
        libraryState:
          type: string
          enum:
            - ready
            - newer
            - damaged
            - missing
            - unreadable
          description: >
            Whether the server has a library. `newer`: a newer version of ReelRoulette saved the catalog,
            and it was left unchanged. `damaged`: the catalog is not a database, is corrupt, or has another
            schema, and was moved aside, or a catalog moved aside earlier is still there. `missing`: there is
            no catalog, but catalog backups exist. `unreadable`: a catalog file could not be opened or read at
            the moment, for example because another program has it locked, and it was left unchanged.
            Without a library, library routes answer 503. `isHealthy` does not change with it.
        libraryMessage:
          type: string
          nullable: true
          description: Why there is no library and what to do about it, or null when `libraryState` is `ready`.

    SessionInfoSnapshot:
      type: object
      required:
        - sessionId
        - createdUtc
        - lastSeenUtc
        - expiresUtc
      properties:
        sessionId:
          type: string
        createdUtc:
          type: string
          format: date-time
        lastSeenUtc:
          type: string
          format: date-time
        expiresUtc:
          type: string
          format: date-time

    SseClientInfoSnapshot:
      type: object
      required:
        - connectionId
        - connectedUtc
      properties:
        connectionId:
          type: string
        clientId:
          type: string
          nullable: true
        sessionId:
          type: string
          nullable: true
        clientType:
          type: string
          nullable: true
        deviceName:
          type: string
          nullable: true
        userAgent:
          type: string
          nullable: true
        connectedUtc:
          type: string
          format: date-time
        remoteAddress:
          type: string
          nullable: true

    ServerLogResponse:
