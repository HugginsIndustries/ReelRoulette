openapi: 3.1.0
info:
  title: ReelRoulette API
  version: 0.15.0-dev.1
  description: Contract-first API with the refresh pipeline, status and settings APIs, and thumbnail artifact retrieval endpoints.
paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/pair:
    get:
      summary: Pair client and issue auth cookie
      operationId: getPair
      description: |
        Pairing endpoint for auth-required mode.
        Accepts token via query (`?token=...`) and issues the pairing cookie when valid.
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Pairing succeeded or auth disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairResponse"
        "401":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Pair client and issue auth cookie
      operationId: postPair
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairRequest"
      responses:
        "200":
          description: Pairing succeeded or auth disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairResponse"
        "401":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/version:
    get:
      summary: Get API and app version
      operationId: getVersion
      responses:
        "200":
          description: Version response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "401":
          description: Unauthorized when auth is required and localhost trust is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/capabilities:
    get:
      summary: Get server capability list
      operationId: getCapabilities
      responses:
        "200":
          description: Capability response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
        "401":
          description: Unauthorized when auth is required and localhost trust is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /control/restart:
    post:
      summary: Request graceful runtime restart (local-first, LAN opt-in)
      operationId: postControlRestart
      responses:
        "200":
          description: Restart accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestartResponse"
        "401":
          description: Unauthorized when a non-local request has no control session or control token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden when the request is from another device and remote connections are off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Restart already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestartResponse"

  /control/stop:
    post:
      summary: Request graceful runtime stop
      operationId: postControlStop
      responses:
        "200":
          description: Stop accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestartResponse"
        "401":
          description: Unauthorized when a non-local request has no control session or control token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden when the request is from another device and remote connections are off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Lifecycle operation already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestartResponse"

  /control/update/status:
    get:
      summary: Get server Velopack self-update state (check/download/apply is operator-driven)
      operationId: getControlUpdateStatus
      responses:
        "200":
          description: Current update state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerUpdateStatusResponse"
        "401":
          description: Unauthorized when a non-local request has no control session or control token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden when the request is from another device and remote connections are off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /control/update/check:
    post:
      summary: Check the configured update feed for a newer server build (does not download or apply)
      operationId: postControlUpdateCheck
      responses:
        "200":
          description: Check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerUpdateActionResponse"
        "401":
          description: Unauthorized when a non-local request has no control session or control token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden when the request is from another device and remote connections are off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /control/update/download:
    post:
      summary: Download the update surfaced by the last successful check (does not apply)
      operationId: postControlUpdateDownload
      responses:
        "200":
          description: Download result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerUpdateActionResponse"
        "401":
          description: Unauthorized when a non-local request has no control session or control token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden when the request is from another device and remote connections are off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /control/update/apply:
    post:
      summary: Apply a downloaded update and restart the server process
      operationId: postControlUpdateApply
      responses:
        "200":
          description: Apply accepted; process will restart shortly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerUpdateActionResponse"
        "401":
          description: Unauthorized when a non-local request has no control session or control token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden when the request is from another device and remote connections are off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /control/status:
    get:
      summary: Get control-plane runtime status and telemetry
      operationId: getControlStatus
      responses:
        "200":
          description: Control status snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlStatusResponse"
        "401":
          description: Unauthorized when a non-local request has no control session or control token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden when the request is from another device and remote connections are off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /control/settings:
    get:
      summary: Get control-plane settings
      operationId: getControlSettings
      responses:
        "200":
          description: Control settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlRuntimeSettingsSnapshot"
        "401":
          description: Unauthorized when a non-local request has no control session or control token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden when the request is from another device and remote connections are off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Apply control-plane settings
      operationId: postControlSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlRuntimeSettingsSnapshot"
      responses:
        "200":
          description: Settings apply result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlSettingsApplyResponse"
        "401":
          description: Unauthorized when a non-local request has no control session or control token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden when the request is from another device and remote connections are off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /control/startup:
    get:
      summary: Get Launch Server on Startup status
      operationId: getControlStartup
      responses:
        "200":
          description: Whether this platform supports launching the server at sign-in, and whether it is on
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartupLaunchStatus"
        "401":
          description: Unauthorized when a non-local request has no control session or control token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden when the request is from another device and remote connections are off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Turn Launch Server on Startup on or off
      operationId: postControlStartup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartupLaunchUpdateRequest"
      responses:
        "200":
          description: The change was applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartupLaunchResult"
        "409":
          description: The change was not applied, for example because the platform does not support it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartupLaunchResult"
        "401":
          description: Unauthorized when a non-local request has no control session or control token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden when the request is from another device and remote connections are off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /control/logs/server:
    get:
      summary: Read server last.log lines
      operationId: getControlServerLogs
      parameters:
        - name: tail
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 5000
          description: Number of trailing lines to return.
        - name: contains
          in: query
          required: false
          schema:
            type: string
            nullable: true
          description: Optional case-insensitive contains filter.
        - name: level
          in: query
          required: false
          schema:
            type: string
            nullable: true
          description: Optional level hint filter (for example info/warn/error).
      responses:
        "200":
          description: Log snapshot response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerLogResponse"
        "401":
          description: Unauthorized when a non-local request has no control session or control token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden when the request is from another device and remote connections are off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /control/testing:
    get:
      summary: Get current operator testing mode and fault flags
      operationId: getControlTestingState
      responses:
        "200":
          description: Operator testing state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorTestingStateSnapshot"
        "401":
          description: Unauthorized when a non-local request has no control session or control token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden when the request is from another device and remote connections are off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /control/testing/update:
    post:
      summary: Update testing mode and operator fault simulation flags
      operationId: postControlTestingUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorTestingUpdateRequest"
      responses:
        "200":
          description: Testing state update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorTestingActionResponse"
        "401":
          description: Unauthorized when a non-local request has no control session or control token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden when the request is from another device and remote connections are off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Testing mode is required before enabling fault simulation flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /control/testing/reset:
    post:
      summary: Reset all testing scenario flags while preserving testing mode state
      operationId: postControlTestingReset
      responses:
        "200":
          description: Testing reset result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorTestingActionResponse"
        "401":
          description: Unauthorized when a non-local request has no control session or control token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden when the request is from another device and remote connections are off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /control/pair:
    post:
      summary: Pair control-plane session and issue admin cookie
      operationId: postControlPair
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairRequest"
      responses:
        "200":
          description: Control pairing succeeded and the admin cookie is set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairResponse"
        "401":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden when the request is from another device and remote connections are off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/presets:
    get:
      summary: Get available presets
      operationId: getPresets
      responses:
        "200":
          description: Preset list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PresetResponse"
        "401":
          description: Unauthorized when auth is required and request is not paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/presets/create:
    post:
      summary: Add a preset after every other one
      description: |
        Gives the preset a new id and publishes `presetCatalogChanged` with it and the request's `clientId`.
      operationId: postPresetCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePresetRequest"
      responses:
        "200":
          description: The new preset, with its id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresetResponse"
        "400":
          description: The name is empty, the filter state is not an object, or the filter is the default one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized when auth is required and request is not paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Another preset has the name, ignoring case, or the filter, and `error` names it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The catalog didn't take the write, which changed nothing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/presets/{presetId}/update:
    post:
      summary: Replace a preset's filter
      description: |
        Publishes `presetCatalogChanged` with the preset's id and the request's `clientId`. The preset's own filter,
        as presets compare filters, is taken.
      operationId: postPresetUpdate
      parameters:
        - name: presetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePresetFilterRequest"
      responses:
        "200":
          description: The preset with its new filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresetResponse"
        "400":
          description: The filter state is not an object, or the filter is the default one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized when auth is required and request is not paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No preset has this id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Another preset has the filter, and `error` names it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The catalog didn't take the write, which changed nothing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/presets/{presetId}/rename:
    post:
      summary: Rename a preset, keeping its id
      description: |
        Publishes `presetCatalogChanged` with the preset's id and the request's `clientId`. A preset may take its own
        name in another case.
      operationId: postPresetRename
      parameters:
        - name: presetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenamePresetRequest"
      responses:
        "200":
          description: The preset with its new name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresetResponse"
        "400":
          description: The name is empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized when auth is required and request is not paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No preset has this id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Another preset has the name, ignoring case, and `error` names it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The catalog didn't take the write, which changed nothing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/presets/reorder:
    post:
      summary: Put the presets in a new order
      description: |
        Changes only the order, and publishes `presetCatalogChanged` with a null `presetId` and the request's
        `clientId`.
      operationId: postPresetReorder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderPresetsRequest"
      responses:
        "200":
          description: The presets are in the new order
        "401":
          description: Unauthorized when auth is required and request is not paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            `presetIds` doesn't name every preset exactly once, as when another device has since added or deleted one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The catalog didn't take the write, which changed nothing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/presets/{presetId}/delete:
    post:
      summary: Delete a preset
      description: |
        Publishes `presetCatalogChanged` with the deleted preset's id and the request's `clientId`.
      operationId: postPresetDelete
      parameters:
        - name: presetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeletePresetRequest"
      responses:
        "200":
          description: The preset is deleted
        "401":
          description: Unauthorized when auth is required and request is not paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No preset has this id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The catalog didn't take the write, which changed nothing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/sources:
    get:
      summary: Get library sources with global enabled states
      operationId: getSources
      responses:
        "200":
          description: Source list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceResponse"
        "401":
          description: Unauthorized when auth is required and request is not paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/sources/import:
    post:
      summary: Import a media source folder into the SQLite catalog
      operationId: postSourceImport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceImportRequest"
      responses:
        "200":
          description: Source import completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceImportResponse"
        "400":
          description: Invalid import request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/library/query:
    post:
      summary: Query a page of library items
      description: |
        Browse path for library filter, search, sort, and paging. Applies enabled sources, then a filename
        or relative-path substring search, then `filterState`, then sort. `searchBaselineCount` is the count
        after search and before `filterState`. `totalCount` is the pageable count after both. Missing files
        stay in the result. Thumbnail layout fields are returned on this page.
      operationId: postLibraryQuery
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryQueryRequest"
      responses:
        "200":
          description: One page of library items plus counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryQueryResponse"
        "400":
          description: Invalid sort, paging, or filterState
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/library/query-ids:
    post:
      summary: List the ids of every library item a query matches
      description: |
        The ids of every item that `POST /api/library/query` with the same `filterState` and `search` matches, for
        selecting all of them: enabled sources, then the search, then the filter, with no paging, no page cap, and no
        order. Each request writes one `last.log` line with the count and the elapsed time.
      operationId: postLibraryQueryIds
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryIdsQueryRequest"
      responses:
        "200":
          description: Every matching item's catalog id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryIdsQueryResponse"
        "400":
          description: Invalid filterState
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized when auth is required and request is not paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/library/delete-files:
    post:
      summary: Delete library items' files from disk and remove the items
      description: |
        Deletes the file of each named item from disk and then removes the item, with its tags, from the library.
        An item whose file isn't on disk, or can't be deleted, stays in the library and is listed in
        `failedItemIds`. An id no item has is skipped. It publishes one `itemsRemoved` event for the items it
        removed, when it removed any. It writes one `last.log` line with the counts, and when some files stay, a
        warning line with how many were missing and the errors' types, both with no paths.

        It is an admin action, accepted as `/control` routes are: from the server machine, a direct request from
        loopback or from the server's own address, and from another machine only with a control session from
        `POST /control/pair` or the control token as a bearer header. A refused request writes a warning line with the
        caller's address. The thumbnails of removed items are deleted by the next refresh's thumbnail stage.
      operationId: postLibraryDeleteFiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteFilesRequest"
      responses:
        "200":
          description: The files that could be deleted are gone, and their items removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteFilesResponse"
        "400":
          description: No item ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized when auth is required and request is not paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >
            The request came from another machine without a control session or the control token (code
            control_token_required), or from another device while remote connections are off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                controlTokenRequired:
                  value:
                    error: Deleting files is an admin action, which needs the server's control token.
                    code: control_token_required
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/library/item:
    post:
      summary: Read one library item
      description: |
        Returns one catalog item by its catalog id. The body matches a list-query item, including tags,
        favorite, blacklist, playback stats, duration, and loudness. Thumbnail layout fields stay on
        `POST /api/library/query`.
      operationId: postLibraryItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryItemReadRequest"
      responses:
        "200":
          description: The requested library item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryProjectionItem"
        "400":
          description: id is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Item was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/library/stats:
    get:
      summary: Get library statistics
      description: |
        Returns global totals and per-source totals from SQL aggregates, plus `baselineLoudnessLufs`, the
        75th percentile of integrated loudness for videos that have audio (−18 LUFS when none qualify).
      operationId: getLibraryStats
      responses:
        "200":
          description: Library statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryStatsResponse"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/library/catalog-checkpoint:
    get:
      summary: Download a standalone catalog checkpoint
      description: |
        Returns a SQLite database of the live catalog, produced while `library.db` is open.
        The file does not depend on a WAL sidecar.
      operationId: getLibraryCatalogCheckpoint
      responses:
        "200":
          description: Standalone SQLite catalog
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "500":
          description: The checkpoint could not be written
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/sources/{sourceId}/enabled:
    post:
      summary: Update global enabled state for a source
      operationId: postSourceEnabled
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSourceEnabledRequest"
      responses:
        "200":
          description: Source state updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceResponse"
        "404":
          description: Source not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized when auth is required and request is not paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/random:
    post:
      summary: Request a random media item
      description: |
        Picks one of the eligible items with the request's options and remembers the pick for the device its
        `clientId` names. `item` is null when nothing is eligible, and `cycle` holds the device's Shuffle cycle
        numbers after the pick.
      operationId: postRandom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RandomRequest"
      responses:
        "200":
          description: The picked item, or null when nothing is eligible, and the cycle numbers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RandomPickResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized when auth is required and request is not paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: |
            `filterState` is omitted or null and no preset has the `presetId` id. `all-media` never returns 404.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >
            The server is running without a library, with a `code` as the LibraryUnavailable response describes; or,
            without a `code`, the library has no items or the server couldn't read it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                empty:
                  value:
                    error: The library is empty.
                unreadable:
                  value:
                    error: The server couldn't read the library.

  /api/random/cycle:
    post:
      summary: Read the device's Shuffle cycle numbers
      description: |
        The cycle numbers a pick with the same body would start from: the eligible items picked on the device
        within the window, the eligible items, and those left. Takes the same body as `POST /api/random` and
        changes nothing.
      operationId: postRandomCycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RandomRequest"
      responses:
        "200":
          description: The cycle numbers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RandomPickCycleResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized when auth is required and request is not paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: |
            `filterState` is omitted or null and no preset has the `presetId` id. `all-media` never returns 404.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >
            The server is running without a library, with a `code` as the LibraryUnavailable response describes; or,
            without a `code`, the library has no items or the server couldn't read it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/random/reset:
    post:
      summary: Clear the device's Shuffle memory
      description: |
        Clears the picks Shuffle remembers for the device the `clientId` names, and its last pick, so every
        eligible item can be picked again. The last picks Spread by folder skips stay.
      operationId: postRandomReset
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RandomResetRequest"
      responses:
        "204":
          description: The device's Shuffle memory is cleared.
        "401":
          description: Unauthorized when auth is required and request is not paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/play/{itemId}:
    post:
      summary: Request playback for a specific library item
      description: |
        Starts server-authoritative play for the item identified by its persisted library `id` (the same
        `id` field exposed in library projection). The route value must be that stable id — not `fullPath`
        (paths are not valid here). Blacklist state does not block this endpoint when the user explicitly
        selects an item. On success, playback stats and last-played are updated and a `playbackRecorded`
        SSE event is emitted (same as `POST /api/record-playback`); callers must not call `record-playback`
        again for the same play start. With `recordPlayback: false` the answer is the same, but nothing is
        recorded and no event is emitted.
      operationId: postPlayItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
          description: Persisted library item `id` (path-safe). Not a filesystem path.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayItemRequest"
      responses:
        "200":
          description: The item to play, as a random pick's `item` gives it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackItemResponse"
        "400":
          description: Missing or blank item id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidId:
                  value:
                    error: itemId is required
                    code: play_item_id_invalid
        "401":
          description: Unauthorized when auth is required and request is not paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >
            Unknown item id (code play_item_not_found) or media missing on disk / testing simulation
            (code play_media_missing).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  value:
                    error: Item not found
                    code: play_item_not_found
                mediaMissing:
                  value:
                    error: Media file not found
                    code: play_media_missing
        "409":
          description: Item exists but its source is disabled (code play_source_disabled).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                sourceDisabled:
                  value:
                    error: Source is disabled for this item
                    code: play_source_disabled
        "415":
          description: File extension is not a supported playable type (code play_unsupported_media).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unsupported:
                  value:
                    error: Unsupported media type
                    code: play_unsupported_media
        "503":
          description: >
            The server is running without a library, with `code` `library_newer`, `library_damaged`,
            `library_missing`, or `library_unreadable` and an `error` that says why and what to do; or the item's
            file exists but can't be read, such as on a stalled drive or share (code play_media_unreadable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                mediaUnreadable:
                  value:
                    error: Media file can't be read
                    code: play_media_unreadable

  /api/show-in-file-manager/{itemId}:
    post:
      summary: Open the server machine's file manager at a library item's file
      description: |
        Opens the system file manager on the server machine with the item's file selected, or, where the file
        manager can't select it, at its folder. Accepted only from the server machine: a direct request from
        loopback or from the server's own address. A request through a reverse proxy is refused, even when the
        proxy runs on the server machine. The capability `api.showInFileManager` tells a caller whether the server
        accepts this route from it. The route value is the item's persisted library `id`, never a path.
      operationId: postShowInFileManager
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
          description: Persisted library item `id` (path-safe). Not a filesystem path.
      responses:
        "204":
          description: The file manager was asked to show the file.
        "401":
          description: Unauthorized when auth is required and request is not paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >
            The request didn't come straight from the server machine (code file_manager_not_local), or it came
            from another device while remote connections are off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notLocal:
                  value:
                    error: Only a browser on the server machine can open its file manager.
                    code: file_manager_not_local
        "404":
          description: >
            Unknown item id (code file_manager_item_not_found), or the item's file isn't on disk
            (code file_manager_file_missing).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  value:
                    error: The file is no longer in the library.
                    code: file_manager_item_not_found
                fileMissing:
                  value:
                    error: The file isn't on disk.
                    code: file_manager_file_missing
        "409":
          description: >
            The server has no desktop session to open a file manager in, or runs on a system it can't open one on
            (code file_manager_unavailable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unavailable:
                  value:
                    error: The server has no desktop to open a file manager in.
                    code: file_manager_unavailable
        "500":
          description: The file manager couldn't be started (code file_manager_failed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                failed:
                  value:
                    error: No file manager on the server machine answered.
                    code: file_manager_failed
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/media/{token}:
    get:
      summary: Stream media by an issued playback token
      description: |
        Streams the file a playback token names. `POST /api/random` and `POST /api/play/{itemId}` issue the
        token in their `mediaUrl`. A catalog item id or a full path is not a token.
      operationId: getMediaByToken
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: A playback token from a `mediaUrl`.
      responses:
        "200":
          description: Media stream response with range support
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized when auth is required and request is not paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown token, or the file is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >
            The server is running without a library, with `code` `library_newer`, `library_damaged`,
            `library_missing`, or `library_unreadable` and an `error` that says why and what to do; or the file
            exists but can't be read, such as on a stalled drive or share, with no `code`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                mediaUnreadable:
                  value:
                    error: Media can't be read

  /api/favorite:
    post:
      summary: Update favorite state for an item
      operationId: postFavorite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoriteRequest"
      responses:
        "200":
          description: Favorite updated, with the item's favorite and blacklist and the revision of the `itemStateChanged` event it published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryStateResponse"
        "400":
          description: Missing item id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized when auth is required and request is not paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No catalog item has this id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/blacklist:
    post:
      summary: Update blacklist state for an item
      operationId: postBlacklist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlacklistRequest"
      responses:
        "200":
          description: Blacklist updated, with the item's favorite and blacklist and the revision of the `itemStateChanged` event it published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryStateResponse"
        "400":
          description: Missing item id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized when auth is required and request is not paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No catalog item has this id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/rating:
    post:
      summary: Set or clear an item's rating
      description: |
        Sets the item's rating, in stars, or clears it with null. It publishes `itemRatingChanged` only when the rating
        changed. A rating is independent of favorite and blacklist, so neither changes.
      operationId: postRating
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingRequest"
      responses:
        "200":
          description: Rating set, or already the item's rating
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemRatingResponse"
        "400":
          description: Missing item id, or a rating that isn't a multiple of 0.5 from 0.5 to 5
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized when auth is required and request is not paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No catalog item has this id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/bulk/item-state:
    post:
      summary: Set or clear favorite or blacklist on many items
      description: |
        Sets or clears `flag` on every named item in one write. Setting favorite clears blacklist, and setting
        blacklist clears favorite, as `POST /api/favorite` and `POST /api/blacklist` do. An id no item has is
        skipped. When any named item is in the library, it publishes one `bulkItemStateChanged` event in place of
        one `itemStateChanged` per item.
      operationId: postBulkItemState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkItemStateRequest"
      responses:
        "200":
          description: Every named item in the library has the requested state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkChangeResponse"
        "400":
          description: No item ids, or a flag that isn't favorite or blacklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized when auth is required and request is not paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/bulk/rating:
    post:
      summary: Set or clear one rating on many items
      description: |
        Sets `rating`, in stars, on every named item in one write, or clears it with null. A rating is independent of
        favorite and blacklist, so neither changes. An id no item has is skipped. When any named item is in the
        library, it publishes one `bulkItemRatingChanged` event in place of one `itemRatingChanged` per item.
      operationId: postBulkRating
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkRatingRequest"
      responses:
        "200":
          description: Every named item in the library has the requested rating
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkChangeResponse"
        "400":
          description: No item ids, or a rating that isn't a multiple of 0.5 from 0.5 to 5
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized when auth is required and request is not paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/record-playback:
    post:
      summary: Record playback for an item
      operationId: postRecordPlayback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordPlaybackRequest"
      responses:
        "200":
          description: Playback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordPlaybackResponse"
        "400":
          description: Missing item id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized when auth is required and request is not paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No catalog item has this id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/playback/clear-stats:
    post:
      summary: Clear playback stats
      description: |
        Clears the play count and last-played time of the items in `itemIds`, or of every item with
        `allItems: true`. A request with neither, or with both, is refused and clears nothing, so a request
        that names no items never clears the whole library.
      operationId: postClearPlaybackStats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClearPlaybackStatsRequest"
      responses:
        "200":
          description: Playback stats cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearPlaybackStatsResponse"
        "400":
          description: Neither `allItems` nor any item id, or both
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized when auth is required and request is not paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/tag-editor/model:
    post:
      summary: Get tag editor model snapshot
      description: |
        The tag catalog, and the tags of the items in `itemIds`, each item's in `items`. With `countsOnly`, `items` is
        empty and `tagCounts` counts how many of the items hold each tag, with `itemCount` the number of them in the
        library, so editing many items' tags doesn't need each item's tags.
      operationId: postTagEditorModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagEditorModelRequest"
      responses:
        "200":
          description: Tag editor model snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagEditorModelResponse"
        "401":
          description: Unauthorized when auth is required and request is not paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/tag-editor/apply-item-tags:
    post:
      summary: Apply batch add/remove tag deltas to items
      operationId: postTagEditorApplyItemTags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyItemTagsRequest"
      responses:
        "200":
          description: Tag delta applied
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No named item is in the library, as after a refresh removed its file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notInLibrary:
                  value:
                    error: The file is no longer in the library.
        "409":
          description: Every named item already has each added tag and lacks each removed one, so nothing changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unchanged:
                  value:
                    error: The tags were already that way.
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/tag-editor/upsert-category:
    post:
      summary: Create or update category metadata
      operationId: postTagEditorUpsertCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertCategoryRequest"
      responses:
        "200":
          description: Category upserted
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/tag-editor/upsert-tag:
    post:
      summary: Create or update tag metadata
      operationId: postTagEditorUpsertTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertTagRequest"
      responses:
        "200":
          description: Tag upserted
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            A tag with that name is already in the category the request names, or exists and no category is
            named.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                exists:
                  value:
                    error: A tag named "Bob" already exists.
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/tag-editor/rename-tag:
    post:
      summary: Rename tag and optionally move category
      operationId: postTagEditorRenameTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameTagRequest"
      responses:
        "200":
          description: Tag renamed
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No tag has the old name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                noTag:
                  value:
                    error: There's no tag named "Bob".
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/tag-editor/delete-tag:
    post:
      summary: Delete a tag
      operationId: postTagEditorDeleteTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteTagRequest"
      responses:
        "200":
          description: Tag deleted
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Neither the tag list nor any item has the tag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                noTag:
                  value:
                    error: There's no tag named "Bob".
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/tag-editor/delete-category:
    post:
      summary: Delete a category and optionally reassign tags
      operationId: postTagEditorDeleteCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteCategoryRequest"
      responses:
        "200":
          description: Category deleted
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The category doesn't exist, or is Uncategorized, which can't be deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                noCategory:
                  value:
                    error: That category doesn't exist.
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/refresh/start:
    post:
      summary: Start unified refresh run
      operationId: postRefreshStart
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshStartRequest"
      responses:
        "200":
          description: Refresh run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshStartResponse"
        "409":
          description: Refresh already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/refresh/status:
    get:
      summary: Get refresh status snapshot
      operationId: getRefreshStatus
      responses:
        "200":
          description: Current refresh status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshStatusSnapshot"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/refresh/settings:
    get:
      summary: Get core-owned refresh settings
      operationId: getRefreshSettings
      responses:
        "200":
          description: Refresh settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshSettingsSnapshot"
    post:
      summary: Update core-owned refresh settings
      operationId: postRefreshSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSettingsSnapshot"
      responses:
        "200":
          description: Updated refresh settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshSettingsSnapshot"

  /api/backup/settings:
    get:
      summary: Get core-owned backup settings
      operationId: getBackupSettings
      responses:
        "200":
          description: Backup settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupSettingsSnapshot"
    post:
      summary: Update core-owned backup settings
      description: |
        Clamps `minimumBackupGapMinutes` to 1–10080 and `numberOfBackups` to 1–100, persists the result,
        and returns the stored snapshot.
      operationId: postBackupSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupSettingsSnapshot"
      responses:
        "200":
          description: Stored backup settings after clamping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupSettingsSnapshot"

  /api/duplicates/scan:
    post:
      summary: Scan for fingerprint-based duplicate groups
      operationId: postDuplicateScan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuplicateScanRequest"
      responses:
        "200":
          description: Duplicate scan results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateScanResponse"
        "400":
          description: Invalid duplicate scan request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/duplicates/apply:
    post:
      summary: Apply duplicate keep/delete selections
      description: |
        Deletes the files of each selection's items but the one it keeps, and removes those items, through the same
        code as `POST /api/library/delete-files`. A selection whose kept item isn't in the library is skipped. It
        publishes one `itemsRemoved` event for the items it removed, when it removed any. It writes the same `last.log`
        lines as `POST /api/library/delete-files`, named `Duplicate apply`.

        It is an admin action, accepted as `POST /api/library/delete-files` is, by the `/control` routes' check.
      operationId: postDuplicateApply
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuplicateApplyRequest"
      responses:
        "200":
          description: Duplicate apply results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateApplyResponse"
        "400":
          description: Invalid duplicate apply request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized when auth is required and request is not paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >
            The request came from another machine without a control session or the control token (code
            control_token_required), or from another device while remote connections are off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                controlTokenRequired:
                  value:
                    error: Deleting files is an admin action, which needs the server's control token.
                    code: control_token_required
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/autotag/scan:
    post:
      summary: Scan for auto-tag suggestions
      operationId: postAutoTagScan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoTagScanRequest"
      responses:
        "200":
          description: Auto-tag scan results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoTagScanResponse"
        "400":
          description: Invalid auto-tag scan request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/autotag/apply:
    post:
      summary: Apply auto-tag assignments
      operationId: postAutoTagApply
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoTagApplyRequest"
      responses:
        "200":
          description: Auto-tag apply results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoTagApplyResponse"
        "400":
          description: Invalid auto-tag apply request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/logs/client:
    post:
      summary: Ingest client-originated log events to centralized server log
      operationId: postClientLog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientLogRequest"
      responses:
        "200":
          description: Log accepted
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted:
                    type: boolean
  /api/web-runtime/settings:
    get:
      summary: Get web runtime settings
      operationId: getWebRuntimeSettings
      responses:
        "200":
          description: Web runtime settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebRuntimeSettingsSnapshot"
    post:
      summary: Update web runtime settings
      description: |
        A port of 0 or less becomes 45123, a blank `lanHostname` becomes `reel`, a blank `authMode` becomes
        `TokenRequired`, and a blank `sharedToken` becomes null. Returns the stored snapshot.
      operationId: postWebRuntimeSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebRuntimeSettingsSnapshot"
      responses:
        "200":
          description: Stored web runtime settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebRuntimeSettingsSnapshot"

  /api/thumbnail/{itemId}:
    get:
      summary: Get generated thumbnail by item id
      operationId: getThumbnailByItemId
      description: >-
        Every 200 and 304 response carries an ETag and Last-Modified. A request whose `v` matches the thumbnail's current
        version is cacheable for a year as immutable. Any other request gets `Cache-Control: no-cache` and is
        revalidated against the ETag.
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
        - name: v
          in: query
          required: false
          description: The item's `thumbnailVersion` from the list query page.
          schema:
            type: string
      responses:
        "200":
          description: Thumbnail image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: The thumbnail matches the request's If-None-Match or If-Modified-Since.
        "404":
          description: Thumbnail not found
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

  /api/events:
    get:
      summary: Stream server events
      operationId: getEventsSse
      description: |
        SSE stream with monotonic `id` values matching envelope `revision`.
        Reconnect behavior:
        - A stream opened without a last event ID starts with a `streamOpened`
          event whose revision is the server's current revision, so a client
          that receives no other event can still resume from it.
        - Client reconnects with `Last-Event-ID`, including 0.
        - Server replays buffered events newer than that revision when available.
        - If the revision gap exceeds replay buffer retention, server emits a
          `resyncRequired` event. Clients requery the state they still show.
          An item-state read returns only the requested paths. An empty path list returns no items.
        Identity/session continuity:
        - Clients should provide a stable `clientId` per installation/device.
        - Clients may provide an optional `sessionId` per runtime session to
          correlate reconnect attempts and playback-originated events.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
          description: Last acknowledged SSE revision from the previous connection.
        - name: lastEventId
          in: query
          required: false
          schema:
            type: string
          description: Query-string reconnect revision fallback for browser EventSource clients.
        - name: clientId
          in: query
          required: false
          schema:
            type: string
            nullable: true
          description: Stable client identity for cross-request correlation.
        - name: sessionId
          in: query
          required: false
          schema:
            type: string
            nullable: true
          description: Optional runtime session identity for reconnect/playback correlation.
        - name: clientType
          in: query
          required: false
          schema:
            type: string
            nullable: true
          description: Optional client type hint (for example web or mobile-web).
        - name: deviceName
          in: query
          required: false
          schema:
            type: string
            nullable: true
          description: Optional friendly device/client label shown in operator diagnostics.
      responses:
        "200":
          description: Event stream (SSE)
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ServerEventEnvelope"
        "401":
          description: Unauthorized when auth is required and request is not paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LibraryUnavailable"

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    PairRequest:
      type: object
      properties:
        token:
          type: string
          nullable: true

    PairResponse:
      type: object
      required:
        - paired
        - message
      properties:
        paired:
          type: boolean
        message:
          type: string

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        code:
          type: string
          nullable: true
          description: Machine-readable error code when applicable (e.g. `POST /api/play/{itemId}`).

    VersionResponse:
      type: object
      required:
        - appVersion
        - apiVersion
        - minimumCompatibleApiVersion
        - supportedApiVersions
        - capabilities
      properties:
        appVersion:
          type: string
        apiVersion:
          type: string
        assetsVersion:
          type: string
          nullable: true
        minimumCompatibleApiVersion:
          type: string
        supportedApiVersions:
          type: array
          items:
            type: string
        capabilities:
          type: array
          items:
            type: string
          description: >
            The server's capabilities. `api.showInFileManager` depends on the caller: it is listed only for a
            direct request from the server machine, while the server has a desktop session to open a file manager
            in, so `POST /api/show-in-file-manager/{itemId}` would be accepted from it.
        libraryState:
          type: string
          enum:
            - ready
            - newer
            - damaged
            - missing
            - unreadable
          description: >
            Whether the server has a library, as `ControlStatusResponse.libraryState` reports it. This route
            answers without a library, so a client learns the state here while library routes and the event
            stream answer 503.
        libraryMessage:
          type: string
          nullable: true
          description: Why there is no library and what to do about it, or null when `libraryState` is `ready`.

    CapabilitiesResponse:
      type: object
      required:
        - capabilities
      properties:
        capabilities:
          type: array
          items:
            type: string
          description: The same list as `VersionResponse.capabilities`, including its caller-dependent entry.

    RestartResponse:
      type: object
      required:
        - accepted
        - message
      properties:
        accepted:
          type: boolean
        message:
          type: string

    ServerUpdatePhase:
      type: string
      enum:
        - notInstalled
        - idle
        - noReleases
        - checkFailed
        - upToDate
        - updateAvailable
        - downloading
        - updateReady
        - restarting

    ServerUpdateStatusResponse:
      type: object
      required:
        - phase
        - message
        - velopackInstalled
      properties:
        phase:
          $ref: "#/components/schemas/ServerUpdatePhase"
        runningVersion:
          type: string
          nullable: true
        targetVersion:
          type: string
          nullable: true
        message:
          type: string
        velopackInstalled:
          type: boolean

    ServerUpdateActionResponse:
      type: object
      required:
        - accepted
        - phase
        - message
        - velopackInstalled
      properties:
        accepted:
          type: boolean
        phase:
          $ref: "#/components/schemas/ServerUpdatePhase"
        runningVersion:
          type: string
          nullable: true
        targetVersion:
          type: string
          nullable: true
        message:
          type: string
        velopackInstalled:
          type: boolean

    ControlRuntimeSettingsSnapshot:
      type: object
      required:
        - adminAuthMode
      properties:
        adminAuthMode:
          type: string
          enum:
            - "Off"
            - TokenRequired
          description: >
            Read-only. GET always returns TokenRequired, and a posted value is ignored:
            every non-local control request needs the control token.
        adminSharedToken:
          type: string
          nullable: true
          description: >
            The control token. The server generates and saves one on start when none is set.
            POST rejects an empty value, and a changed token ends every control session.
        devChannelEnabled:
          type: boolean
          nullable: true
          description: >
            When omitted or null on POST, the persisted dev-channel preference is left unchanged.
            GET always returns the current boolean value (stable or dev update channel).

    ControlApplyResult:
      type: object
      required:
        - accepted
        - restartRequired
        - message
      properties:
        accepted:
          type: boolean
        restartRequired:
          type: boolean
        message:
          type: string
        errors:
          type: array
          items:
            type: string

    StartupLaunchStatus:
      type: object
      required: [supported, launchServerOnStartup, message]
      properties:
        supported:
          type: boolean
        launchServerOnStartup:
          type: boolean
        message:
          type: string

    StartupLaunchUpdateRequest:
      type: object
      properties:
        launchServerOnStartup:
          type: boolean

    StartupLaunchResult:
      type: object
      required: [accepted, supported, launchServerOnStartup, message]
      properties:
        accepted:
          type: boolean
        supported:
          type: boolean
        launchServerOnStartup:
          type: boolean
        message:
          type: string

    ControlSettingsApplyResponse:
      type: object
      required:
        - settings
        - result
      properties:
        settings:
          $ref: "#/components/schemas/ControlRuntimeSettingsSnapshot"
        result:
          $ref: "#/components/schemas/ControlApplyResult"

    ApiEventTelemetryEntry:
      type: object
      required:
        - timestampUtc
        - direction
        - method
        - path
      properties:
        timestampUtc:
          type: string
          format: date-time
        direction:
          type: string
        method:
          type: string
        path:
          type: string
        statusCode:
          type: integer
          format: int32
          nullable: true
        eventType:
          type: string
          nullable: true

    ConnectedClientsSnapshot:
      type: object
      required:
        - apiPairedSessions
        - controlPairedSessions
        - sseSubscribers
        - apiSessions
        - controlSessions
        - activeSseClients
      properties:
        apiPairedSessions:
          type: integer
          format: int32
        controlPairedSessions:
          type: integer
          format: int32
        sseSubscribers:
          type: integer
          format: int32
        apiSessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfoSnapshot"
        controlSessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfoSnapshot"
        activeSseClients:
          type: array
          items:
            $ref: "#/components/schemas/SseClientInfoSnapshot"

    ControlStatusResponse:
      type: object
      required:
        - serverTimeUtc
        - isHealthy
        - listenUrl
        - lanExposed
        - connectedClients
      properties:
        serverTimeUtc:
          type: string
          format: date-time
        isHealthy:
          type: boolean
        listenUrl:
          type: string
        lanExposed:
          type: boolean
          description: Whether remote connections are allowed (the web runtime setting `bindOnLan`).
        connectedClients:
          $ref: "#/components/schemas/ConnectedClientsSnapshot"
        incomingApiEvents:
          type: array
          items:
            $ref: "#/components/schemas/ApiEventTelemetryEntry"
        outgoingApiEvents:
          type: array
          items:
            $ref: "#/components/schemas/ApiEventTelemetryEntry"
        testing:
          $ref: "#/components/schemas/OperatorTestingStateSnapshot"
        libraryState:
          type: string
          enum:
            - ready
            - newer
            - damaged
            - missing
            - unreadable
          description: >
            Whether the server has a library. `newer`: a newer version of ReelRoulette saved the catalog,
            and it was left unchanged. `damaged`: the catalog is not a database, is corrupt, or has another
            schema, and was moved aside, or a catalog moved aside earlier is still there. `missing`: there is
            no catalog, but catalog backups exist. `unreadable`: a catalog file could not be opened or read at
            the moment, for example because another program has it locked, and it was left unchanged.
            Without a library, library routes answer 503. `isHealthy` does not change with it.
        libraryMessage:
          type: string
          nullable: true
          description: Why there is no library and what to do about it, or null when `libraryState` is `ready`.

    SessionInfoSnapshot:
      type: object
      required:
        - sessionId
        - createdUtc
        - lastSeenUtc
        - expiresUtc
      properties:
        sessionId:
          type: string
        createdUtc:
          type: string
          format: date-time
        lastSeenUtc:
          type: string
          format: date-time
        expiresUtc:
          type: string
          format: date-time

    SseClientInfoSnapshot:
      type: object
      required:
        - connectionId
        - connectedUtc
      properties:
        connectionId:
          type: string
        clientId:
          type: string
          nullable: true
        sessionId:
          type: string
          nullable: true
        clientType:
          type: string
          nullable: true
        deviceName:
          type: string
          nullable: true
        userAgent:
          type: string
          nullable: true
        connectedUtc:
          type: string
          format: date-time
        remoteAddress:
          type: string
          nullable: true

    ServerLogResponse:
      type: object
      required:
        - sourcePath
        - totalLinesRead
        - lines
      properties:
        sourcePath:
          type: string
        totalLinesRead:
          type: integer
          format: int32
        lines:
          type: array
          items:
            type: string

    OperatorTestingStateSnapshot:
      type: object
      required:
        - testingModeEnabled
        - forceApiVersionMismatch
        - forceCapabilityMismatch
        - forceApiUnavailable
        - forceMediaMissing
        - forceSseDisconnect
        - lastUpdatedUtc
      properties:
        testingModeEnabled:
          type: boolean
        forceApiVersionMismatch:
          type: boolean
        forceCapabilityMismatch:
          type: boolean
        forceApiUnavailable:
          type: boolean
        forceMediaMissing:
          type: boolean
        forceSseDisconnect:
          type: boolean
        lastUpdatedUtc:
          type: string
          format: date-time

    OperatorTestingUpdateRequest:
      type: object
      properties:
        testingModeEnabled:
          type: boolean
          nullable: true
        forceApiVersionMismatch:
          type: boolean
          nullable: true
        forceCapabilityMismatch:
          type: boolean
          nullable: true
        forceApiUnavailable:
          type: boolean
          nullable: true
        forceMediaMissing:
          type: boolean
          nullable: true
        forceSseDisconnect:
          type: boolean
          nullable: true

    OperatorTestingActionResponse:
      type: object
      required:
        - accepted
        - message
        - state
      properties:
        accepted:
          type: boolean
        message:
          type: string
        state:
          $ref: "#/components/schemas/OperatorTestingStateSnapshot"

    FilterState:
      type: object
      additionalProperties: true
      description: |
        A library filter, as clients send it and presets store it. Browse, its counts, and random picks apply
        it the same way. Every field is optional, so `{}` is a valid filter, and each field's default applies
        when it is missing, or null where the field allows it. Fields not listed here are allowed and ignored,
        including the older `favoritesOnly` and `excludeBlacklisted`, which the catalog's upgrade rewrote into
        `favoritesMode` and `blacklistedMode` in every stored preset.
      properties:
        favoritesMode:
          type: string
          enum:
            - "off"
            - "only"
            - "excluded"
          description: |
            How the filter treats favorites: `off` ignores them, `only` keeps only favorites, and `excluded` leaves
            them out. Read in any case. Another value, including null or a number, counts as missing, which is
            `off`.
        blacklistedMode:
          type: string
          enum:
            - "off"
            - "only"
            - "excluded"
          description: |
            How the filter treats blacklisted items: `off` ignores them, `only` keeps only blacklisted items, and
            `excluded` leaves them out. Read in any case. Another value, including null or a number, counts as
            missing, which is `excluded`. An item is never both favorite and blacklisted, so `favoritesMode` `only`
            with `only` here matches nothing.
        onlyNeverPlayed:
          type: boolean
          description: Only items never played. Defaults to false.
        onlyKnownDuration:
          type: boolean
          description: Only videos with a known duration. Photos always pass. Defaults to false.
        onlyKnownLoudness:
          type: boolean
          description: Only videos with a known loudness. Photos always pass. Defaults to false.
        onlyBrowserPlayable:
          type: boolean
          description: |
            Only videos in a container a browser can play: files ending in `.mp4`, `.m4v`, or `.webm`, in any case.
            Photos always pass. Defaults to false.
        onlyUnrated:
          type: boolean
          description: Only items with no rating. Defaults to false.
        minRating:
          type: number
          format: double
          nullable: true
          description: |
            Only items rated at or above this many stars, from 0.5 to 5 in half-star steps, so unrated items are
            left out, and with `onlyUnrated` nothing matches. Another value, such as a string or a number between
            half stars, counts as missing, which is no minimum.
        audioFilter:
          oneOf:
            - type: integer
            - type: string
          description: |
            `PlayAll` (0), `WithAudioOnly` (1), or `WithoutAudioOnly` (2), as a number or a name in any case.
            Photos always pass. Defaults to `PlayAll`.
        mediaTypeFilter:
          oneOf:
            - type: integer
            - type: string
          description: |
            `All` (0), `VideosOnly` (1), or `PhotosOnly` (2), as a number or a name in any case. Defaults to
            `All`.
        globalMatchMode:
          type: boolean
          nullable: true
          description: How selected tags from different categories combine. True is AND, false is OR, and null is AND.
        categoryLocalMatchModes:
          type: object
          nullable: true
          additionalProperties:
            oneOf:
              - type: integer
              - type: string
          description: |
            How selected tags in one category combine, keyed by category id: `And` (0) or `Or` (1), as a number
            or a name in any case. A category not listed is `And`.
        selectedTags:
          type: array
          nullable: true
          items:
            type: string
          description: |
            Tag names an item must match, ignoring case, combined by `globalMatchMode` and
            `categoryLocalMatchModes`. Defaults to none.
        excludedTags:
          type: array
          nullable: true
          items:
            type: string
          description: Tag names, ignoring case, that leave out any item holding one. Defaults to none.
        includedSourceIds:
          type: array
          nullable: true
          items:
            type: string
          description: Source ids to limit the filter to. Empty or missing means every enabled source.
        minDuration:
          anyOf:
            - type: string
            - type: number
            - type: "null"
          description: |
            Shortest video duration. A number is seconds, and a string is .NET TimeSpan text, such as
            `HH:MM:SS` or `d.HH:MM:SS.fffffff`, so `"90"` is 90 days and `"1:30"` is 1 hour 30
            minutes. Videos without a known duration are left out, and photos always pass. Defaults to no limit.
        maxDuration:
          anyOf:
            - type: string
            - type: number
            - type: "null"
          description: |
            Longest video duration, written as `minDuration` is. Videos without a known duration are left out,
            and photos always pass. Defaults to no limit.
        addedRange:
          anyOf:
            - $ref: "#/components/schemas/FilterDateRangePreset"
            - $ref: "#/components/schemas/FilterCustomDateRange"
            - type: "null"
          description: |
            The days an item's date added, when its file came into the library, must fall in: a preset, which rolls
            with the clock, or a custom range. The server resolves it in its own time zone, to whole days:
            `last7Days` is today and the 6 days before it, `last30Days` and `last90Days` likewise, `thisYear` is
            1 January to 31 December, and a custom range covers its first and last days. Items without a date
            added are left out. Another value, such as an unknown preset, a date that isn't one, or a range that
            ends before it starts, counts as missing, which is no limit. Defaults to no limit.
        createdRange:
          anyOf:
            - $ref: "#/components/schemas/FilterDateRangePreset"
            - $ref: "#/components/schemas/FilterCustomDateRange"
            - type: "null"
          description: |
            The days an item's date created, its file's modified time, must fall in, written and read as
            `addedRange` is. Items without a date created are left out. Defaults to no limit.

    FilterDateRangePreset:
      type: string
      description: A date range that rolls with the clock, as a filter's `addedRange` or `createdRange`, matched in any case.
      enum:
        - last7Days
        - last30Days
        - last90Days
        - thisYear

    FilterCustomDateRange:
      type: object
      description: A custom range of whole days, as a filter's `addedRange` or `createdRange`.
      required:
        - from
        - to
      properties:
        from:
          type: string
          format: date
          description: The range's first day, written YYYY-MM-DD.
        to:
          type: string
          format: date
          description: The range's last day, written YYYY-MM-DD, on or after `from`.

    PresetResponse:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: The preset's own id, kept across renames, which the preset routes and `presetCatalogChanged` use.
        name:
          type: string
        filterState:
          anyOf:
            - $ref: "#/components/schemas/FilterState"
            - type: "null"
          description: >-
            The filter the preset was saved with, as it was posted, with later tag renames and deletions applied, and
            with the older `favoritesOnly` and `excludeBlacklisted` rewritten into `favoritesMode` and
            `blacklistedMode` by the catalog's upgrade.

    SourceResponse:
      type: object
      required:
        - id
        - rootPath
        - isEnabled
      properties:
        id:
          type: string
        rootPath:
          type: string
        displayName:
          type: string
          nullable: true
        isEnabled:
          type: boolean

    UpdateSourceEnabledRequest:
      type: object
      required:
        - isEnabled
      properties:
        isEnabled:
          type: boolean

    SourceImportRequest:
      type: object
      required: [rootPath]
      properties:
        rootPath:
          type: string
        displayName:
          type: string
          nullable: true

    SourceImportResponse:
      type: object
      required: [accepted, message, importedCount, updatedCount]
      properties:
        accepted:
          type: boolean
        message:
          type: string
        sourceId:
          type: string
          nullable: true
        importedCount:
          type: integer
          format: int32
        updatedCount:
          type: integer
          format: int32

    LibraryIdsQueryRequest:
      type: object
      properties:
        filterState:
          anyOf:
            - $ref: "#/components/schemas/FilterState"
            - type: "null"
          description: As in `LibraryQueryRequest`.
        search:
          type: string
          nullable: true
          description: As in `LibraryQueryRequest`.

    LibraryIdsQueryResponse:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          description: The catalog id of every item the query matches.
          items:
            type: string

    LibraryQueryRequest:
      type: object
      properties:
        filterState:
          anyOf:
            - $ref: "#/components/schemas/FilterState"
            - type: "null"
          description: |
            Omitted or null applies no filter predicates, so blacklisted items are listed. A present object uses
            the same field defaults as playback filters, so blacklisted items are left out when `blacklistedMode`
            doesn't say otherwise.
        search:
          type: string
          nullable: true
          description: Filename or relative-path substring. Blank or whitespace matches every enabled-source item.
        sortMode:
          type: string
          nullable: true
          enum:
            - Name
            - LastPlayed
            - PlayCount
            - Duration
            - DateAdded
            - DateCreated
            - Rating
          default: Name
        sortDescending:
          type: boolean
          default: false
          description: Direction of the primary sort key only. Filename and item id tie-breaks stay ascending.
        offset:
          type: integer
          format: int32
          minimum: 0
          default: 0
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000
          default: 100
          description: Up to 10,000, so a client can reload the window it has loaded in one request.

    LibraryQueryResponse:
      type: object
      required:
        - items
        - totalCount
        - searchBaselineCount
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LibraryProjectionItem"
        totalCount:
          type: integer
          format: int32
          description: Count after search and filter. This is the pageable set.
        searchBaselineCount:
          type: integer
          format: int32
          description: Count after search and before filter.

    LibraryItemReadRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: Catalog item id.

    LibraryProjectionItem:
      type: object
      description: One library item. List query adds thumbnail layout fields at serve time. Those fields are not stored in the catalog and are not part of the single-item read.
      additionalProperties: true
      properties:
        id:
          type: string
        sourceId:
          type: string
        fullPath:
          type: string
          description: The file's full path on the server.
        fileName:
          type: string
        relativePath:
          type: string
        mediaType:
          oneOf:
            - type: integer
            - type: string
        isFavorite:
          type: boolean
        isBlacklisted:
          type: boolean
        playCount:
          type: integer
          format: int32
        fingerprintAlgorithm:
          type: string
        fingerprintVersion:
          type: integer
          format: int32
        tags:
          type: array
          description: The item's tag names.
          items:
            type: string
        rating:
          type: number
          format: double
          description: The rating in stars, from 0.5 to 5 in half-star steps, present only for a rated item.
        hasAudio:
          type: boolean
          description: Present once the loudness scan has looked at a video. False for a file without an audio track or one whose track the scan measured as digital silence, and true otherwise.
        duration:
          type: string
          description: Duration as `hh:mm:ss`, in whole seconds, present when the catalog has it.
        durationSeconds:
          type: number
          format: double
          description: Duration in seconds, present when the catalog has it.
        integratedLoudness:
          type: number
          format: double
          description: Integrated loudness in LUFS, measured by the loudness scan, present when the scan has measured it.
        peakDb:
          type: number
          format: double
          description: The true peak the loudness scan measured, in dBTP, present when the scan has measured one.
        loudnessError:
          type: string
          description: Why the loudness scan couldn't measure the video, present when its last scan failed.
        lastPlayedUtc:
          type: string
          format: date-time
          description: When the item last played, in UTC, present once it has played.
        dateAddedUtc:
          type: string
          format: date-time
          description: When the item's file came into the library, in UTC, present when the catalog has it.
        dateCreatedUtc:
          type: string
          format: date-time
          description: The file's modified time, which the app calls its date created, in UTC, present when the catalog has it.
        fileSizeBytes:
          type: integer
          format: int64
          description: The file's size in bytes, present when the catalog has it.
        fingerprint:
          type: string
          description: The file's content fingerprint, a SHA-256 hash, present once the fingerprint scan has hashed it.
        fingerprintLastUtc:
          type: string
          format: date-time
          description: When the fingerprint scan last hashed the file, in UTC, present once it has.
        fingerprintStatus:
          type: integer
          format: int32
          description: The fingerprint's state, present when the catalog has one. 0 is pending, 1 ready, 2 failed, and 3 stale.
        hasThumbnail:
          type: boolean
          description: True when a generated thumbnail JPEG exists for this item id.
        thumbnailVersion:
          type: string
          description: Opaque version of the thumbnail JPEG, present when it exists. It changes whenever the thumbnail is written again. Pass it as `v` to the thumbnail route.
        thumbnailWidth:
          type: integer
          format: int32
          nullable: true
          description: Generated thumbnail width in pixels when the catalog has it.
        thumbnailHeight:
          type: integer
          format: int32
          nullable: true
          description: Generated thumbnail height in pixels when the catalog has it.

    RandomRequest:
      type: object
      properties:
        presetId:
          type: string
          description: |
            A saved preset's id, exactly, used only when `filterState` is omitted or null. A preset's name finds no
            preset. `all-media`, which is never a preset's id, picks with the default filter.
        filterState:
          anyOf:
            - $ref: "#/components/schemas/FilterState"
            - type: "null"
          description: |
            The filter to pick with. Omitted or null falls back to `presetId`, whose filter uses the same field
            defaults, so blacklisted items are left out unless it says otherwise.
        clientId:
          type: string
          nullable: true
          description: |
            The device whose random-pick memory the request uses. Requests without one share a memory of their own.
        includeVideos:
          type: boolean
          default: true
        includePhotos:
          type: boolean
          default: true
        options:
          anyOf:
            - $ref: "#/components/schemas/RandomPickOptionsRequest"
            - type: "null"
          description: The options the pick combines. Omitted or null, every option takes its default.

    RandomPickOptionsRequest:
      type: object
      description: |
        The options a random pick combines. A missing option takes its default, a `rememberPlaysForDays` other than
        the values listed or null reads as 30, and a `spreadByTags` the server doesn't know reads as `off`. With every
        option off, picks are pure random.
      properties:
        shuffle:
          type: boolean
          default: true
          description: Leaves out the items picked on this device within the window, until every eligible item has been.
        rememberPlaysForDays:
          type: integer
          format: int32
          nullable: true
          enum:
            - 1
            - 7
            - 30
            - 90
          default: 30
          description: |
            How long the device's picks are remembered, in days, or null for until every eligible item has been
            picked. Any other value reads as 30.
        spreadByFolder:
          type: boolean
          default: true
          description: Leaves out the items in the folders of the device's recent picks.
        spreadByTags:
          type: string
          enum:
            - "off"
            - allTags
            - byCategory
          default: "off"
          description: |
            Makes items whose tags came up in the device's recent picks beyond their share less likely, counting
            every tag or only the tags of `spreadCategoryIds`. Read in any case; any other value reads as `off`.
        spreadCategoryIds:
          type: array
          items:
            type: string
          description: The categories whose tags count under `byCategory`. An id no category has is ignored.
        favorLessPlayed:
          type: boolean
          default: false
        favorNewlyAdded:
          type: boolean
          default: false
        favorNewlyCreated:
          type: boolean
          default: false
        favorHigherRated:
          type: boolean
          default: false

    RandomPickResponse:
      type: object
      required:
        - item
        - cycle
      properties:
        item:
          anyOf:
            - $ref: "#/components/schemas/PlaybackItemResponse"
            - type: "null"
          description: The picked item, or null when nothing is eligible.
        cycle:
          $ref: "#/components/schemas/RandomPickCycleResponse"

    RandomPickCycleResponse:
      type: object
      required:
        - picked
        - eligible
        - remaining
      properties:
        picked:
          type: integer
          format: int32
          description: The eligible items picked on this device within the window, in the current cycle.
        eligible:
          type: integer
          format: int32
          description: The items the filter and the media types leave.
        remaining:
          type: integer
          format: int32
          description: The eligible items not yet picked in the cycle; with `picked`, they add up to `eligible`.

    RandomResetRequest:
      type: object
      properties:
        clientId:
          type: string
          nullable: true
          description: The device whose Shuffle memory to clear.

    PlayItemRequest:
      type: object
      properties:
        clientId:
          type: string
          nullable: true
        sessionId:
          type: string
          nullable: true
        recordPlayback:
          type: boolean
          default: true
          description: Defaults to true; the WebUI sends false only to get a fresh media URL for an item already playing.

    PlaybackItemResponse:
      type: object
      required:
        - id
        - itemId
        - displayName
        - mediaType
        - mediaUrl
        - isFavorite
        - isBlacklisted
        - rating
      properties:
        id:
          type: string
          description: Full path of the file.
        itemId:
          type: string
          description: Catalog item id.
        displayName:
          type: string
        mediaType:
          type: string
          enum:
            - video
            - photo
        durationSeconds:
          type: number
          format: double
          nullable: true
        integratedLoudness:
          type: number
          format: double
          nullable: true
          description: Integrated loudness in LUFS, measured by the loudness scan, or null when the scan hasn't measured it. A video without audio, a digitally silent one included, has none.
        peakDb:
          type: number
          format: double
          nullable: true
          description: The true peak the loudness scan measured, in dBTP, or null when the scan hasn't measured one. A video without audio, a digitally silent one included, has none.
        mediaUrl:
          type: string
        isFavorite:
          type: boolean
        isBlacklisted:
          type: boolean
        rating:
          type: number
          format: double
          nullable: true
          description: The rating in stars, from 0.5 to 5 in half-star steps, or null for none.

    FavoriteRequest:
      type: object
      required:
        - itemId
        - isFavorite
      properties:
        itemId:
          type: string
          description: Catalog item id.
        isFavorite:
          type: boolean
        clientId:
          type: string
          nullable: true
          description: The client making the change, which `itemStateChanged` names.

    BlacklistRequest:
      type: object
      required:
        - itemId
        - isBlacklisted
      properties:
        itemId:
          type: string
          description: Catalog item id.
        isBlacklisted:
          type: boolean
        clientId:
          type: string
          nullable: true
          description: The client making the change, which `itemStateChanged` names.

    RatingRequest:
      type: object
      required:
        - itemId
        - rating
      properties:
        itemId:
          type: string
          description: Catalog item id.
        rating:
          type: number
          format: double
          nullable: true
          description: The rating in stars, a multiple of 0.5 from 0.5 to 5, or null to clear it. A request without it clears the rating too.
        clientId:
          type: string
          nullable: true
          description: The client making the change, which `itemRatingChanged` names.

    RecordPlaybackRequest:
      type: object
      required:
        - itemId
      properties:
        clientId:
          type: string
          nullable: true
        sessionId:
          type: string
          nullable: true
        itemId:
          type: string
          description: Catalog item id.

    RecordPlaybackResponse:
      type: object
      required:
        - accepted
        - itemId
        - revision
        - playCount
      properties:
        accepted:
          type: boolean
        itemId:
          type: string
          description: Catalog item id of the file that was played.
        revision:
          type: integer
          format: int64
          description: Revision of the `playbackRecorded` event.
        playCount:
          type: integer
          format: int32
          description: Play count after this play.
        lastPlayedUtc:
          type: string
          format: date-time
          nullable: true
          description: Last-played time after this play.

    BulkItemStateRequest:
      type: object
      required:
        - itemIds
        - flag
        - value
      properties:
        itemIds:
          type: array
          description: Catalog item ids. An id no item has is skipped.
          items:
            type: string
        flag:
          type: string
          enum:
            - favorite
            - blacklist
          description: Which flag to set or clear.
        value:
          type: boolean
          description: True sets the flag, false clears it.
        clientId:
          type: string
          nullable: true
          description: The client making the change, which `bulkItemStateChanged` names.

    BulkRatingRequest:
      type: object
      required:
        - itemIds
        - rating
      properties:
        itemIds:
          type: array
          description: Catalog item ids. An id no item has is skipped.
          items:
            type: string
        rating:
          type: number
          format: double
          nullable: true
          description: The rating in stars, a multiple of 0.5 from 0.5 to 5, or null to clear it. A request without it clears the rating too.
        clientId:
          type: string
          nullable: true
          description: The client making the change, which `bulkItemRatingChanged` names.

    BulkChangeResponse:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          format: int32
          description: How many of the named items are in the library, each of which now has the requested state.

    DeleteFilesRequest:
      type: object
      required:
        - itemIds
      properties:
        itemIds:
          type: array
          description: Catalog item ids. An id no item has is skipped.
          items:
            type: string

    DeleteFilesResponse:
      type: object
      required:
        - deletedCount
        - failedItemIds
      properties:
        deletedCount:
          type: integer
          format: int32
          description: How many files were deleted, each of whose items was removed from the library.
        failedItemIds:
          type: array
          description: The items whose file wasn't on disk or couldn't be deleted. They stay in the library.
