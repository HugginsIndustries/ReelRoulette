      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/AutoTagMatchRowResponse"

    AutoTagMatchRowResponse:
      type: object
      required: [tagName, totalMatchedCount, wouldChangeCount, files]
      properties:
        tagName:
          type: string
        totalMatchedCount:
          type: integer
          format: int32
        wouldChangeCount:
          type: integer
          format: int32
        files:
          type: array
          items:
            $ref: "#/components/schemas/AutoTagMatchedFileResponse"

    AutoTagMatchedFileResponse:
      type: object
      required: [itemId, fullPath, displayPath, needsChange]
      properties:
        itemId:
          type: string
        fullPath:
          type: string
        displayPath:
          type: string
        needsChange:
          type: boolean

    AutoTagApplyRequest:
      type: object
      required: [assignments]
      properties:
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/AutoTagAssignment"

    AutoTagAssignment:
      type: object
      required: [tagName, itemPaths]
      properties:
        tagName:
          type: string
        itemPaths:
          type: array
          items:
            type: string

    AutoTagAppliedAssignment:
      type: object
      required: [tagName, changedItemPaths, changedItemIds]
      properties:
        tagName:
          type: string
        changedItemPaths:
          type: array
          description: Files that gained this tag.
          items:
            type: string
        changedItemIds:
          type: array
          description: Catalog item ids of the files that gained this tag.
          items:
            type: string

    AutoTagApplyResponse:
      type: object
      required: [assignmentsAdded, changedItemPaths, changedItemIds, applied]
      properties:
        assignmentsAdded:
          type: integer
          format: int32
        changedItemPaths:
          type: array
          items:
            type: string
        changedItemIds:
          type: array
          description: Catalog item ids of the files that gained a tag.
          items:
            type: string
        applied:
          type: array
          description: One entry per tag that was newly written, listing only the files that gained that tag.
          items:
            $ref: "#/components/schemas/AutoTagAppliedAssignment"

    ClientLogRequest:
      type: object
      required: [source, level, message]
      properties:
        source:
          type: string
        level:
          type: string
        message:
          type: string

    RefreshStageProgress:
      type: object
      required: [stage, percent, message, isComplete]
      properties:
        stage:
          type: string
        percent:
          type: integer
          format: int32
        message:
          type: string
        isComplete:
          type: boolean

    RefreshStatusSnapshot:
      type: object
      required: [isRunning, trigger, stages]
      properties:
        isRunning:
          type: boolean
        runId:
          type: string
          nullable: true
        trigger:
          type: string
        startedUtc:
          type: string
          format: date-time
          nullable: true
        completedUtc:
          type: string
          format: date-time
          nullable: true
        currentStage:
          type: string
          nullable: true
        lastError:
          type: string
          nullable: true
        stages:
          type: array
          items:
            $ref: "#/components/schemas/RefreshStageProgress"

    ItemTagsChangedPayload:
      type: object
      required: [itemIds, resolvedItemIds, addedTags, removedTags]
      properties:
        itemIds:
          type: array
          description: The files as the change named them. A tag apply lists the item ids or full paths the request sent, and auto-tag apply lists full paths.
          items:
            type: string
        resolvedItemIds:
          type: array
          description: Catalog item ids of the listed files that are in the catalog.
          items:
            type: string
        addedTags:
          type: array
          items:
            type: string
        removedTags:
          type: array
          items:
            type: string
        catalogReplacedTag:
          type: string
          nullable: true
          description: Set when this event renames or deletes the tag in the catalog. Absent for a per-item edit.
        catalogReplacementTag:
          type: string
          nullable: true
          description: The new name when catalogReplacedTag is a rename. Absent when that tag was deleted.

    TagCatalogChangedPayload:
      type: object
      required: [reason, categories, tags]
      properties:
        reason:
          type: string
        categories:
          type: array
          items:
            $ref: "#/components/schemas/TagCategorySnapshot"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagSnapshot"

    SourceStateChangedPayload:
      type: object
      required:
        - sourceId
        - isEnabled
      properties:
        sourceId:
          type: string
        isEnabled:
          type: boolean

    RefreshStatusChangedPayload:
      type: object
      required: [snapshot]
      properties:
        snapshot:
          $ref: "#/components/schemas/RefreshStatusSnapshot"

  responses:
    LibraryUnavailable:
      description: >
        The server is running without a library. `error` says why and what to do, and `code` is
        `library_newer`, `library_damaged`, `library_missing`, or `library_unreadable`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
